[project]
name = "timestral-demo"
version = "0.1.0"
description = "A documented Timestral-209M forecasting notebook"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn",
    "timestral",
    "torch>=2.4",
]

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral.git" }
